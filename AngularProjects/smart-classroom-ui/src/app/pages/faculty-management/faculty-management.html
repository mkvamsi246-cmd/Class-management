<div class="page-container">
  <div class="page-header">
    <h1>Faculty Management</h1>
    <p class="subtitle">Add and manage faculty members</p>
  </div>

  <div class="form-card">
    <h2>Add New Faculty</h2>
    <div class="form-grid">

      <div class="form-group">
        <label for="facultyName">Faculty Name *</label>
        <input
          id="facultyName"
          type="text"
          placeholder="e.g. Dr. John Smith"
          [(ngModel)]="facultyName">
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <input
          id="department"
          type="text"
          placeholder="e.g. Computer Science"
          [(ngModel)]="department">
      </div>

      <div class="form-group">
        <label for="facultyEmail">Email *</label>
        <input
          id="facultyEmail"
          type="email"
          placeholder="faculty@college.com"
          [(ngModel)]="email">
      </div>

      <div class="form-group">
        <label for="facultyPassword">Password *</label>
        <input
          id="facultyPassword"
          type="password"
          placeholder="Login password"
          [(ngModel)]="password">
      </div>

    </div>
    <div class="form-actions">
      <button class="btn-primary" (click)="saveFaculty()">
        + Add Faculty
      </button>
    </div>
  </div>

  <div class="table-card">
    <h2>All Faculty</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Department</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        @for(faculty of facultyList; track faculty.id) {
        <tr>
          <td>{{faculty.id}}</td>
          <td><strong>{{faculty.facultyName}}</strong></td>
          <td>{{faculty.department || '—'}}</td>
          <td>{{faculty.email}}</td>
        </tr>
        }
        @empty {
        <tr><td colspan="4" class="empty">No faculty members found.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>

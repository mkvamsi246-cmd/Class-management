<div class="login-container">

    <div class="login-box">

        <img src="srkr-logo.png" alt="SRKR Engineering College Logo" class="srkr-login-logo">

        <h1>SRKR Smart Classroom</h1>

        <p>
            Intelligent Room Management System
        </p>

        <input
            type="email"
            placeholder="Enter Email"
            [(ngModel)]="email">

        <input
            type="password"
            placeholder="Enter Password"
            [(ngModel)]="password">

        <button (click)="login()">
            Login
        </button>

    </div>

</div>

<div class="login-container">

    <div class="login-box">

        <div class="logo">

            🏫

        </div>

        <h1>Smart Classroom</h1>

        <p>
            Intelligent Room Management System
        </p>

        <input
            type="email"
            placeholder="Enter Email"
            [(ngModel)]="email">

        <input
            type="password"
            placeholder="Enter Password"
            [(ngModel)]="password">

        <button (click)="login()">
            Login
        </button>

    </div>

</div>
